{{- if .Values.green.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.app.name }}-green
spec:
  replicas: {{ .Values.app.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.app.name }}
      version: green
  template:
    metadata:
      labels:
        app: {{ .Values.app.name }}
        version: green
    spec:
      containers:
      - name: app
        image: {{ .Values.app.image }}
        env:
        - name: RESPONSE
          value: {{ .Values.green.response | quote }}
        ports:
        - containerPort: {{ .Values.app.port }}
{{- end }}

